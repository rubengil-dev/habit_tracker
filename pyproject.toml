[project]
name = "habit-tracker"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.6",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "hypothesis>=6.170.15",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
# Real mistakes only (errors, undefined or unused names, likely bugs); style is set by ESTILO.md, not the linter
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008"]                           # Depends() in default arguments is how FastAPI works

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]   # A database warning is a bug: the test fails
